<html lang="en">
<head>

<style>
/* Layout: phone-first. Sticky wordmark bar; home opens on a serif headline over the calculator index;
   a calculator stacks inputs, a results panel set in the display serif, a live diagram, then the math.
   From 960px the index becomes a left rail beside the open calculator.
   Look: one deliberate dark theme for every viewer. Warm black, a single gold accent, hairlines, no glow. */
:root {
  --bg: #0B0A08;
  --surface: #13110E;
  --surface-2: #1A1713;
  --ink: #F1E9DB;
  --ink-2: #CFC5B5;
  --muted: #9C9284;
  --line: #27231D;
  --line-strong: #3A342B;
  --gold: #DDAA62;
  --gold-hi: #EDC78C;
  --gold-lo: #A8773B;
  --gold-dim: #B38D58;
  --course: #DDAA62;        /* course and track lines */
  --hdg: #F1E9DB;           /* heading and airspeed line */
  --wind: #8FB3C4;          /* the one cool color: moving air */
  --good: #9DC79A;
  --bad: #EA8A6C;
  --runway: #2A2620;
  --runway-mark: #F1E9DB;
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --r-panel: 16px;
  color-scheme: dark;
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 640px at 94% -8%, rgba(190, 128, 58, .2), transparent 62%),
    radial-gradient(720px 520px at -12% 34%, rgba(190, 128, 58, .06), transparent 60%);
  background-repeat: no-repeat;
  color: var(--ink);
  font: 400 16px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
::selection { background: rgba(221, 170, 98, .32); }
a { color: var(--gold); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(11, 10, 8, .84);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font: 500 25px/1 var(--font-display); letter-spacing: .03em; color: var(--gold); padding-top: 3px; }
.topbar .back {
  margin-left: auto; font: 600 13.5px/1 var(--font-ui); letter-spacing: .01em; text-decoration: none; padding: 12px 0 12px 12px;
}

.shell {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  display: grid; gap: 28px;
}
@media (min-width: 960px) {
  .shell { grid-template-columns: 312px minmax(0, 1fr); align-items: start; gap: 48px; padding-block: 36px 64px; }
  .index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 82px); max-height: calc(100vh - 106px); overflow: auto; padding-right: 8px; }
  .topbar .back { display: none; }
}
@media (max-width: 959.98px) {
  body.has-calc .index { display: none; }
  body:not(.has-calc) .calc { display: none; }
  body:not(.has-calc) .topbar .back { display: none; }
}

/* Shared type roles */
.eyebrow { margin: 0; font: 600 11px/1.2 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--gold-dim); }
.calc-head h1, .hero-title {
  margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: -.012em; text-wrap: balance;
  color: var(--gold);
  background: linear-gradient(100deg, var(--gold-hi) 0%, var(--gold) 46%, var(--gold-lo) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  padding-bottom: .1em;
}

/* Index */
.index { display: grid; gap: 26px; align-content: start; }
.hero { display: grid; gap: 12px; padding-top: 6px; }
.hero-title { font-size: clamp(50px, 15vw, 68px); line-height: .98; }
.hero-sub { margin: 0; font: 400 18px/1.42 var(--font-display); color: var(--ink-2); max-width: 30ch; }
.intro { display: grid; gap: 6px; }
.intro p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.intro b { color: var(--ink-2); font-weight: 600; }
.ix-group { display: grid; gap: 9px; }
.ix-group h2 { margin: 0 2px; font: 600 11px/1.2 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--gold-dim); }
.ix-list { overflow: hidden; }
.ix-item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px;
  padding: 13px 14px 13px 16px; text-decoration: none; color: var(--ink);
  border-top: 1px solid var(--line);
}
.ix-item:first-child { border-top: 0; }
.ix-name { font: 600 15px/1.3 var(--font-ui); }
.ix-sub { grid-column: 1; font-size: 13px; color: var(--muted); line-height: 1.4; }
.ix-item::after {
  content: ""; grid-column: 2; grid-row: 1 / span 2; width: 7px; height: 7px;
  border: solid var(--gold-dim); border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); margin-right: 4px;
}
.ix-item:hover { background: rgba(241, 233, 219, .035); }
.ix-item[aria-current="page"] { background: rgba(221, 170, 98, .09); }
.ix-item[aria-current="page"] .ix-name { color: var(--gold); }
@media (min-width: 960px) {
  .hero-title { font-size: 52px; }
}

/* Calculator */
.calc { display: grid; gap: 18px; min-width: 0; align-content: start; }
.calc-head { display: grid; gap: 10px; padding-bottom: 4px; }
.calc-head h1 { font-size: clamp(36px, 10vw, 52px); line-height: 1.04; }
.calc-head p { margin: 0; font: 400 18px/1.45 var(--font-display); color: var(--ink-2); max-width: 58ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.inputs { padding: 4px 16px; }
.field {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.field:last-child { border-bottom: 0; }
.field label { font-weight: 500; font-size: 15px; line-height: 1.3; }
.field .hint { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.control { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
.num {
  width: 7.4ch; min-width: 0; min-height: 40px; padding: 7px 10px; text-align: right;
  font: 600 17px/1.2 var(--font-ui); font-variant-numeric: lining-nums tabular-nums; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r);
  transition: border-color .15s, box-shadow .15s;
}
.num.sm { width: 4.8ch; }
.num.wide { width: 9ch; }
.num:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(221, 170, 98, .18); }
.sfx { font: 600 13px/1 var(--font-ui); color: var(--muted); min-width: 2.6em; }
.sfx.tight { min-width: 0; }
.sel { position: relative; display: inline-flex; }
.sel::after {
  content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; margin-top: -5px; pointer-events: none;
  border: solid var(--gold-dim); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
}
.sel select {
  appearance: none; -webkit-appearance: none; cursor: pointer;
  font: 600 16px/1.2 var(--font-ui); color: var(--ink-2); min-height: 40px;
  background: transparent; border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 6px 26px 6px 10px; min-width: 4.4em;
}
.sel select:focus-visible { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(221, 170, 98, .18); }
.pm {
  width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--line-strong); background: transparent;
  font: 600 16px/1 var(--font-ui); color: var(--ink-2); cursor: pointer; flex: none;
}
.pm:active { border-color: var(--gold); color: var(--gold); }

/* Results: set in the display serif */
.readout {
  background: linear-gradient(180deg, #1A1611 0%, #12100D 100%); color: var(--ink); border-radius: var(--r-panel); overflow: hidden;
  border: 1px solid #40372A; box-shadow: inset 0 1px 0 rgba(255, 233, 196, .05), 0 18px 40px rgba(0, 0, 0, .35);
}
.ro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #2E281F; }
.ro-grid.n1 { grid-template-columns: minmax(0, 1fr); }
.ro-grid.odd > .ro-cell:first-child { grid-column: span 2; }
@media (min-width: 700px) {
  .ro-grid.n3, .ro-grid.n5, .ro-grid.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ro-grid.n3 > .ro-cell:first-child { grid-column: auto; }
}
.ro-cell { background: linear-gradient(180deg, #1A1611 0%, #14110E 100%); padding: 14px 16px 15px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.ro-label { font: 600 10.5px/1.3 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ro-val { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
.ro-num {
  font: 500 clamp(29px, 8vw, 38px)/1.05 var(--font-display); font-variant-numeric: lining-nums tabular-nums;
  color: var(--gold); white-space: nowrap; letter-spacing: -.005em;
}
.ro-num.dim { color: #6E665A; }
.ro-unit { font: 600 12.5px/1 var(--font-ui); color: var(--muted); letter-spacing: .02em; }
.ro-side { font: 600 12px/1.2 var(--font-ui); color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.readout .sel select { color: var(--muted); border: 0; font-size: 16px; min-height: 0; padding: 3px 16px 3px 0; min-width: 0; border-radius: 6px; }
.readout .sel::after { right: 2px; }
.ro-msg { padding: 13px 16px; font: 600 13.5px/1.4 var(--font-ui); color: var(--bad); border-top: 1px solid #2E281F; }
.ro-msg.info { color: var(--muted); font-weight: 400; }
.ro-msg:empty { display: none; }

.diagram { margin: 0; padding: 14px 16px 16px; display: grid; gap: 12px; }
.diagram svg { width: 100%; height: auto; max-width: 520px; justify-self: center; display: block; }
.diagram svg text { font-family: var(--font-ui); font-variant-numeric: lining-nums tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; border: 0; }
.legend i.ring { width: 9px; height: 9px; border-radius: 50%; border: 2px solid; }
.diagram-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 26px 0; }

details.math { padding: 0 16px; }
details.math summary {
  cursor: pointer; padding: 15px 0; font: 600 14px/1.3 var(--font-ui); list-style: none; display: flex; align-items: center; gap: 10px;
}
details.math summary::-webkit-details-marker { display: none; }
details.math summary::before { content: "+"; font: 400 18px/1 var(--font-ui); color: var(--gold); width: 1ch; }
details.math[open] summary::before { content: "\2212"; }
.math-body { padding: 0 0 16px; display: grid; gap: 9px; font-size: 14.5px; color: var(--ink-2); max-width: 66ch; }
.math-body p { margin: 0; }
.math-body code, .f {
  font: 400 13px/1.55 var(--font-code); color: var(--ink); background: rgba(241, 233, 219, .035); border: 1px solid var(--line);
  border-radius: 8px; padding: 1px 6px; overflow-wrap: anywhere;
}
.f { display: block; padding: 9px 12px; }

/* Unit converter */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 8px 14px;
  font: 600 13px/1.2 var(--font-ui); color: var(--ink-2); cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.chip[aria-pressed="true"] { background: var(--gold); color: #17110A; border-color: var(--gold); }
.conv-list { display: grid; }
.conv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; border-top: 1px solid #2E281F; }
.conv-row:first-child { border-top: 0; }
.conv-row .ro-num { font-size: clamp(24px, 6.6vw, 30px); color: var(--ink); }
.conv-row .ro-num.course { color: var(--gold); }
.conv-row .ro-label { text-align: right; }

/* Weight & balance */
.wb-ac { padding: 14px 16px; display: grid; gap: 8px; }
.wb-ac label { font-weight: 500; font-size: 15px; }
.wb-ac .sel { display: flex; }
.wb-ac .sel select { width: 100%; color: var(--ink); font-size: 16px; padding: 9px 32px 9px 12px; background: var(--surface-2); }
.wb-ac p { margin: 0; font-size: 13px; color: var(--muted); }
.wb-table { display: grid; }
.wb-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 4.6em; align-items: center; gap: 2px 8px;
  padding: 10px 16px; border-top: 1px solid var(--line);
}
.wb-row.head { padding-block: 10px 8px; font: 600 10.5px/1.2 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.wb-row.total { background: rgba(241, 233, 219, .03); font-weight: 600; border-radius: 0 0 var(--r-panel) var(--r-panel); padding-block: 14px; }
.wb-name { font-weight: 500; font-size: 15px; line-height: 1.3; min-width: 0; }
.wb-name small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.wb-name small .num { width: 5.6ch; min-height: 0; font-size: 16px; padding: 3px 7px; border-radius: 8px; }
.wb-mom { text-align: right; font: 500 14px/1.25 var(--font-ui); font-variant-numeric: lining-nums tabular-nums; color: var(--muted); }
.wb-row.total .wb-mom { color: var(--ink); font-weight: 700; }
.wb-row .control { justify-content: flex-end; }
.wb-row .sfx { min-width: 2.2em; }
.wb-row .control .num { width: 6.6ch; }
.status { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px;
  font: 600 13px/1.25 var(--font-ui); border: 1px solid var(--line-strong); color: var(--muted);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.good { color: var(--good); border-color: rgba(157, 199, 154, .34); background: rgba(157, 199, 154, .06); }
.pill.bad { color: var(--bad); border-color: rgba(234, 138, 108, .42); background: rgba(234, 138, 108, .08); }

.foot { font-size: 12.5px; line-height: 1.55; color: var(--muted); display: grid; gap: 6px; max-width: 70ch; padding-top: 4px; }
.foot p { margin: 0; }
@media (prefers-reduced-motion: reduce) {
  .num, .chip { transition: none; }
}
</style>
</head>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#home" aria-label="E6B Flight Computer, all calculators">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect x="6" y="6" width="500" height="500" rx="112" fill="#16130F" stroke="#3A342B" stroke-width="12"/>
        <circle cx="256" cy="256" r="170" fill="none" stroke="#DDAA62" stroke-width="12"/>
        <path d="M256 256 L356 156" stroke="#DDAA62" stroke-width="28" stroke-linecap="round"/>
        <path d="M256 256 L208 166" stroke="#F1E9DB" stroke-width="20" stroke-linecap="round"/>
        <circle cx="256" cy="256" r="24" fill="#16130F" stroke="#F1E9DB" stroke-width="10"/>
      </svg>
      <b>E6B</b>
    </a>
    <a class="back" href="#home">&lsaquo; All calculators</a>
  </div>
</header>

<main class="shell">
  <nav class="index" id="index" aria-label="Calculators"></nav>
  <section class="calc" id="calc" aria-live="polite"></section>
</main>

  if (!(sc >= -1 && sc <= 1)) return null;           /* crosswind component stronger than TAS */

  const ax = Math.sin(wdr) * ws + Math.sin(ca) * tas;
  const ay = Math.cos(wdr) * ws + Math.cos(ca) * tas;
  if (ax * Math.sin(tcr) + ay * Math.cos(tcr) <= 0) return null;   /* headwind stronger than TAS */
  return { th: fixAngle(ca * R2D), gs: Math.hypot(ax, ay) };
}

  return e > 0 ? Math.pow(e, 5.255) : NaN;
}

  return 145442.156 * (1 - Math.pow((pInHg / 29.92) / (tK / 288.15), 0.234969));

/* ---------------- Diagrams ---------------- */
function arrow(p, q, color, w, dash) {

    `<polygon points="${q.x.toFixed(1)},${q.y.toFixed(1)} ${(bx - uy * hw).toFixed(1)},${(by + ux * hw).toFixed(1)} ${(bx + uy * hw).toFixed(1)},${(by - ux * hw).toFixed(1)}" style="fill:${color}"/>`;
}
function vecLabel(p, q, c, text, color) {
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
  let nx = -(q.y - p.y), ny = q.x - p.x; const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;

  const anchor = nx > 0.35 ? 'start' : nx < -0.35 ? 'end' : 'middle';
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" style="fill:${color};font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">${esc(text)}</text>`;
}
function northArrow(x, y) {
  return `<g><polygon points="${x},${y - 14} ${x - 6},${y + 2} ${x},${y - 2} ${x + 6},${y + 2}" style="fill:var(--muted)"/><text x="${x}" y="${y + 17}" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-weight:700">N</text></g>`;
}
function windTriangle(th, tas, wd, ws, su) {
  if (!ok(th, tas, wd, ws) || tas <= 0) return `<div class="diagram-empty">Fill in every field to draw the wind triangle.</div>`;
  const A = { x: Math.sin(th * D2R) * tas, y: -Math.cos(th * D2R) * tas };
  const wr = (wd + 180) * D2R;
  const G = { x: A.x + Math.sin(wr) * ws, y: A.y - Math.cos(wr) * ws };
  const xs = [0, A.x, G.x], ys = [0, A.y, G.y];
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = 340, H = 250, mx = 70, my = 40;
  const sc = Math.min((W - 2 * mx) / Math.max(maxX - minX, 1e-6), (H - 2 * my) / Math.max(maxY - minY, 1e-6));
  const cx = W / 2 - (minX + maxX) / 2 * sc, cy = H / 2 - (minY + maxY) / 2 * sc;
  const P = p => ({ x: cx + p.x * sc, y: cy + p.y * sc });
  const o = P({ x: 0, y: 0 }), a = P(A), g = P(G);
  const ctr = { x: (o.x + a.x + g.x) / 3, y: (o.y + a.y + g.y) / 3 };
  const trk = fixAngle(Math.atan2(G.x, -G.y) * R2D), gs = Math.hypot(G.x, G.y);
  const wca = ((th - trk + 540) % 360) - 180;
  const sp = v => fmtNum(conv('speed', 'kt', su, v), 0) + ' ' + UNITS.speed[su].n;
  const windShown = ws * sc >= 3;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wind triangle: heading ${deg(th)} at ${sp(tas)}, wind from ${deg(wd)} at ${sp(ws)}, track ${deg(trk)} at ${sp(gs)}">
    ${northArrow(22, 26)}
    ${arrow(o, g, 'var(--course)', 3.5, '')}
    ${arrow(o, a, 'var(--hdg)', 2.5, '')}
    ${windShown ? arrow(a, g, 'var(--wind)', 2.5, '6 5') : ''}
    <circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="4.5" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>
    ${vecLabel(o, a, ctr, 'HDG ' + deg(th), 'var(--hdg)')}
    ${windShown ? vecLabel(a, g, ctr, 'WIND', 'var(--wind)') : ''}
    ${vecLabel(o, g, ctr, 'TRK ' + deg(trk), 'var(--course)')}
  </svg>`;
  const side = Math.abs(wca) < 0.5 ? 'none' : `${Math.abs(wca).toFixed(0)}° ${wca > 0 ? 'right' : 'left'}`;
  return svg + `<div class="legend">
    <span><i style="border-color:var(--hdg)"></i>Heading ${deg(th)} · TAS ${sp(tas)}</span>
    <span><i class="dash" style="border-color:var(--wind)"></i>Wind from ${deg(wd)} at ${sp(ws)}</span>
    <span><i style="border-color:var(--course)"></i>Track ${deg(trk)} · GS ${sp(gs)}</span>
    <span>Wind correction ${side}</span></div>`;
}
function crosswindSVG(rw, wd, ws, vals, su) {
  if (!ok(rw, wd, ws) || rw < 1 || rw > 36) return `<div class="diagram-empty">Enter a runway and wind to see the picture.</div>`;
  const W = 340, H = 270, cx = 170, cy = 135, hdg = rw * 10;
  const n1 = String(Math.round(rw)).padStart(2, '0');
  const n2 = String(((Math.round(rw) + 17) % 36) + 1).padStart(2, '0');
  const dashes = [-60, -30, 0, 30, 60].map(y => `<rect x="${cx - 1.5}" y="${cy + y - 8}" width="3" height="16" style="fill:var(--runway-mark)"/>`).join('');
  const rwyG = `<g transform="rotate(${hdg} ${cx} ${cy})">
      <rect x="${cx - 19}" y="${cy - 108}" width="38" height="216" rx="2" style="fill:var(--runway);stroke:var(--line-strong);stroke-width:1"/>
      ${dashes}
      <text x="${cx}" y="${cy + 97}" text-anchor="middle" style="fill:var(--runway-mark);font-size:15px;font-weight:700">${n1}</text>
      <text x="${cx}" y="${cy - 97}" text-anchor="middle" transform="rotate(180 ${cx} ${cy - 102})" style="fill:var(--runway-mark);font-size:15px;font-weight:700">${n2}</text>
    </g>`;
  const from = { x: cx + Math.sin(wd * D2R) * 122, y: cy - Math.cos(wd * D2R) * 122 };
  const to = { x: cx + Math.sin(wd * D2R) * 34, y: cy - Math.cos(wd * D2R) * 34 };
  const sp = v => fmtNum(conv('speed', 'kt', su, v), 0) + ' ' + UNITS.speed[su].n;
  const lx = cx + Math.sin(wd * D2R) * 138, ly = cy - Math.cos(wd * D2R) * 138 + 4;
  const anchor = Math.sin(wd * D2R) > 0.35 ? 'end' : Math.sin(wd * D2R) < -0.35 ? 'start' : 'middle';
  const xw = vals ? vals[0] : NaN, hw = vals ? vals[1] : NaN;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Runway ${n1} with wind from ${deg(wd)} at ${sp(ws)}">
    ${northArrow(22, 26)}
    ${rwyG}
    ${ws > 0 ? arrow(from, to, 'var(--wind)', 3, '') : ''}
    <text x="${Math.min(W - 6, Math.max(6, lx)).toFixed(1)}" y="${Math.min(H - 4, Math.max(14, ly)).toFixed(1)}" text-anchor="${anchor}" style="fill:var(--wind);font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:4px">${deg(wd)} @ ${esc(sp(ws))}</text>
  </svg>`;
  const legend = Number.isFinite(xw) ? `<div class="legend"><span><i style="border-color:var(--wind)"></i>Wind from ${deg(wd)}</span><span>Crosswind ${sp(Math.abs(xw))} ${Math.abs(xw) < 0.05 ? '' : xw < 0 ? 'from the left' : 'from the right'}</span><span>${hw <= 0 ? 'Headwind' : 'Tailwind'} ${sp(Math.abs(hw))}</span></div>` : '';
  return svg + legend;
}

    <figure class="panel diagram" id="wb-chart"></figure>
    ${mathHTML(`<span class="f">moment = weight × arm</span><span class="f">CG = total moment ÷ total weight</span>
      <p>The arm is the distance from the datum to each station. The CG has to stay inside the envelope from takeoff until the fuel is burned off, so both points are checked. The chart assumes all tanks burn down together.</p>
      <p>Va here is the book Va (${ac.va} ${vaU} at ${fmtNum(ac.wmax, 0)} lb) scaled by √(weight ÷ max gross).</p>
      <p>Envelope data comes from the original E6B app. Always check against your airplane’s POH.</p>`)}`;
  updateWB();
}
function updateWB() {
  const ac = acByName(S.wb.ac), d = wbData(ac), r = wbCompute(ac, d);
  const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  const msg = document.getElementById('ro-msg');
  if (!r) {
    ['wb-r0', 'wb-r1', 'wb-r2', 'wb-r3', 'wb-r4', 'wb-r5'].forEach(id => set(id, '—'));
    msg.className = 'ro-msg info'; msg.textContent = 'Enter the empty weight and arm.';
    document.getElementById('wb-status').innerHTML = '';
    document.getElementById('wb-chart').innerHTML = `<div class="diagram-empty">The envelope chart appears once the empty weight is filled in.</div>`;
    return;
  }
  msg.textContent = '';
  set('wb-me', fmtNum(r.em, 0));
  r.rows.forEach((m, i) => set(`wb-ms${i}`, fmtNum(m, 0)));
  r.frows.forEach((f, i) => set(`wb-mf${i}`, `${fmtNum(f.w, 0)} lb · ${fmtNum(f.m, 0)}`));
  set('wb-tw', fmtNum(r.W, 0) + ' lb'); set('wb-tm', fmtNum(r.M, 0));
  set('wb-r0', fmtNum(r.W, 0)); set('wb-r1', fmtNum(r.cg, 2));
  set('wb-r2', fmtNum(r.zW, 0)); set('wb-r3', fmtNum(r.zcg, 2));
  const va = w => w > 0 ? ac.va * Math.sqrt(w / ac.wmax) : NaN;
  set('wb-r4', fmtNum(va(r.W), 0)); set('wb-r5', fmtNum(va(r.zW), 0));
  /* status pills */
  const pills = [];
  const over = r.W - ac.wmax;
  pills.push(over > 0.5 ? `<span class="pill bad">${fmtNum(over, 0)} lb over max gross (${fmtNum(ac.wmax, 0)} lb)</span>` : `<span class="pill good">${fmtNum(-over, 0)} lb under max gross</span>`);
  ac.r.filter(([n, p]) => /^(normal|utility)$/i.test(n) && p.length >= 3).forEach(([n, p]) => {
    const to = nearInside(p, r.cg, r.W), zf = !(r.zW > 0) || nearInside(p, r.zcg, r.zW);
    const cls = to && zf ? 'good' : /normal/i.test(n) ? 'bad' : 'neutral';
    const txt = to && zf ? `Within ${n} category` : !to && !zf ? `Outside ${n} category` : !to ? `Outside ${n} category at takeoff` : `Outside ${n} category as fuel burns`;
    pills.push(`<span class="pill ${cls}">${txt}</span>`);
  });
  ac.t.forEach(([n, cap], i) => { const g = num(d.f[i]); if (Number.isFinite(g) && g > cap + 0.05) pills.push(`<span class="pill bad">${esc(n)} holds only ${plain(cap, 1)} gal</span>`); });
  document.getElementById('wb-status').innerHTML = pills.join('');
  document.getElementById('wb-chart').innerHTML = wbChart(ac, r);
}
function niceStep(range, n) {
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function wbChart(ac, r) {
  const W = 360, H = 270, ml = 60, mr = 14, mt = 14, mb = 38;
  const pts = ac.r.flatMap(([, p]) => p).concat([[r.W, r.cg]]).concat(r.zW > 0 ? [[r.zW, r.zcg]] : []).filter(([w, a]) => ok(w, a));
  let wmin = Math.min(...pts.map(p => p[0])), wmax = Math.max(...pts.map(p => p[0]));
  let amin = Math.min(...pts.map(p => p[1])), amax = Math.max(...pts.map(p => p[1]));
  const wp = (wmax - wmin) * 0.08 || 100, ap = (amax - amin) * 0.08 || 2;
  wmin -= wp; wmax += wp; amin -= ap; amax += ap;
  const X = a => ml + (a - amin) / (amax - amin) * (W - ml - mr);
  const Y = w => H - mb - (w - wmin) / (wmax - wmin) * (H - mt - mb);
  const sa = niceStep(amax - amin, 5), sw = niceStep(wmax - wmin, 5);
  let grid = '';
  for (let a = Math.ceil(amin / sa) * sa; a <= amax; a += sa) grid += `<line x1="${X(a).toFixed(1)}" x2="${X(a).toFixed(1)}" y1="${mt}" y2="${H - mb}" style="stroke:var(--line);stroke-width:1"/><text x="${X(a).toFixed(1)}" y="${H - mb + 16}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${plain(a, 1)}</text>`;
  for (let w = Math.ceil(wmin / sw) * sw; w <= wmax; w += sw) grid += `<line x1="${ml}" x2="${W - mr}" y1="${Y(w).toFixed(1)}" y2="${Y(w).toFixed(1)}" style="stroke:var(--line);stroke-width:1"/><text x="${ml - 6}" y="${(Y(w) + 4).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font-size:11px">${fmtNum(w, 0)}</text>`;
  const polys = ac.r.map(([n, p]) => {
    const d = p.map(([w, a]) => `${X(a).toFixed(1)},${Y(w).toFixed(1)}`).join(' ');
    if (/normal/i.test(n)) return `<polygon points="${d}" style="fill:var(--course);fill-opacity:.08;stroke:var(--course);stroke-width:1.75;stroke-linejoin:round"/>`;
    if (/utility/i.test(n)) return `<polygon points="${d}" style="fill:var(--hdg);fill-opacity:.04;stroke:var(--hdg);stroke-width:1.25;stroke-dasharray:6 4"/>`;
    return `<polygon points="${d}" style="fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3"/>`;
  }).join('');
  const to = { x: X(r.cg), y: Y(r.W) };
  const hasZ = r.zW > 0 && Number.isFinite(r.zcg);
  const zf = hasZ ? { x: X(r.zcg), y: Y(r.zW) } : null;
  const names = ac.r.map(([n]) => n);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CG envelope for the ${esc(ac.n)} with takeoff point ${fmtNum(r.W, 0)} lb at ${fmtNum(r.cg, 2)} in">
      ${grid}${polys}
      ${zf ? `<line x1="${to.x.toFixed(1)}" y1="${to.y.toFixed(1)}" x2="${zf.x.toFixed(1)}" y2="${zf.y.toFixed(1)}" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3"/>` : ''}
      ${zf ? `<circle cx="${zf.x.toFixed(1)}" cy="${zf.y.toFixed(1)}" r="5" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>` : ''}
      <circle cx="${to.x.toFixed(1)}" cy="${to.y.toFixed(1)}" r="6" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>
      <text x="${(ml + (W - ml - mr) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="fill:var(--muted);font-size:11px">CG arm (in aft of datum)</text>
      <text x="10" y="${((H - mb + mt) / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 10 ${((H - mb + mt) / 2).toFixed(1)})" style="fill:var(--muted);font-size:11px">Weight (lb)</text>
    </svg>
    <div class="legend">
      ${names.some(n => /normal/i.test(n)) ? `<span><i style="border-color:var(--course)"></i>Normal category</span>` : ''}
      ${names.some(n => /utility/i.test(n)) ? `<span><i class="dash" style="border-color:var(--hdg)"></i>Utility category</span>` : ''}
      <span><i class="dot" style="background:var(--ink)"></i>Takeoff</span>
      ${zf ? `<span><i class="ring" style="border-color:var(--ink)"></i>Fuel burned off</span>` : ''}
    </div>`;
}

/* ---------------- Index + routing ---------------- */
function renderIndex(active) {
  const standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  $index.innerHTML = `<header class="hero"><div class="hero-title">Flight<br>Computer</div>
      <p class="hero-sub">Wind, altitude, speed, fuel, and weight and balance for 35 aircraft.</p></header>
    <div class="intro"><p>Example values are filled in. Change any field and the results update as you type.</p>
      <p>Calculators share values, so a true airspeed you work out is ready in the wind calculators.</p>
      ${standalone || !touch ? '' : `<p>On iPhone: tap Share, then <b>Add to Home Screen</b> to open it like an app.</p>`}</div>` +
    GROUPS.map(gn => `<div class="ix-group"><h2>${esc(gn)}</h2><div class="ix-list panel">${CALCS.filter(c => c.group === gn).map(c =>
      `<a class="ix-item" href="#${c.id}"${c.id === active ? ' aria-current="page"' : ''}><span class="ix-name">${esc(c.name)}</span><span class="ix-sub">${esc(c.sub)}</span></a>`).join('')}</div></div>`).join('') +
    `<footer class="foot"><p>For training and advisory use only. Not for navigation or flight planning: check results against official sources and your POH.</p>
      <p>Math ported from the open-source <a href="https://github.com/w3woody/e6b" target="_blank" rel="noopener">E6B app by William Woody</a> (GPL-3.0).</p></footer>`;
}
let current = null;
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const wide = matchMedia('(min-width: 960px)').matches;
  let c = BY_ID[id];
  if (!c && wide) c = BY_ID[S.last] || BY_ID.planner;
  document.body.classList.toggle('has-calc', !!BY_ID[id]);
  renderIndex(c && c.id);
  if (!c) { current = null; $calc.innerHTML = ''; return; }
  const changed = !current || current.id !== c.id;
  current = c; S.last = c.id; save();
  if (c.custom === 'units') renderUnits(c);
  else if (c.custom === 'wb') renderWB();
  else renderStd(c);
  document.title = `${c.name} · E6B Flight Computer`;
  if (changed && BY_ID[id] && !wide) window.scrollTo(0, 0);
}

/* ---------------- Events ---------------- */
$calc.addEventListener('input', e => {
  const t = e.target;
  if (!current) return;
  if (current.custom === 'units') { if (t.id === 'cv-in') { S.conv.t = t.value; save(); updateUnits(); } return; }
  if (current.custom === 'wb') {
    const d = wbData(acByName(S.wb.ac)), f = t.dataset.wb;
    if (f === 's' || f === 'f') d[f][+t.dataset.i] = t.value; else if (f) d[f] = t.value;
    save(); updateWB(); return;
  }
  const k = t.dataset.k;
  if (!k || t.tagName !== 'INPUT') return;
  if (t.dataset.part) setV(k, { [t.dataset.part]: t.value }); else setV(k, { t: t.value });
  updateStd(current, true);
});
$calc.addEventListener('change', e => {
  const t = e.target;
  if (!current || t.tagName !== 'SELECT') return;
  if (t.id === 'wb-ac') { S.wb.ac = t.value; save(); renderWB(); return; }
  if (t.id === 'cv-u') {
    const x = num(S.conv.t);
    if (Number.isFinite(x)) { S.conv.t = plain(conv(S.conv.kind, S.conv.u, t.value, x), 4); document.getElementById('cv-in').value = S.conv.t; }
    S.conv.u = t.value; save(); updateUnits(); return;
  }
  if (t.dataset.out != null) {
    const o = current.outputs[+t.dataset.out];
    S.ou[o.ou || `${current.id}:${t.dataset.out}`] = t.value; save();
    updateStd(current, false); return;
  }
  const k = t.dataset.k;
  if (!k) return;
  if (t.dataset.role === 'dir') { setV(k, { d: t.value }); updateStd(current, true); return; }
  if (t.dataset.role === 'unit') {
    const s = cur(k), x = num(s.t);
    const patch = { u: t.value };
    if (Number.isFinite(x)) patch.t = plain(conv(s.kind, s.u, t.value, x), UNITS[s.kind][t.value].dp + 1);
    setV(k, patch);
    const inp = document.getElementById(t.id.replace(/-u$/, ''));
    if (inp && patch.t != null) inp.value = patch.t;
    updateStd(current, true);
  }
});
$calc.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { S.conv.kind = chip.dataset.kind; S.conv.u = Object.keys(UNITS[S.conv.kind])[0]; save(); renderUnits(); return; }
  const pm = e.target.closest('.pm');
  if (pm) {
    const inp = document.getElementById(pm.dataset.target);
    if (!inp) return;
    const v = inp.value.trim();
    inp.value = v.startsWith('-') ? v.slice(1) : '-' + v;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.focus();
  }
});
window.addEventListener('hashchange', route);
matchMedia('(min-width: 960px)').addEventListener('change', route);
route();

/* Offline support when hosted (GitHub Pages). Inside a sandboxed preview this quietly does nothing. */
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
